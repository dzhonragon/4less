name: Publish

on:
  push:
    branches: [main]
    paths:
      - package.json

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    environment:
      name: publish

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version_check
        run: |
          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "none")
          CURR=$(node -p "require('./package.json').version")
          echo "previous=$PREV"
          echo "current=$CURR"
          if [ "$PREV" = "$CURR" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$CURR" >> $GITHUB_OUTPUT

      - name: Skip if version unchanged
        if: steps.version_check.outputs.changed == 'false'
        run: |
          echo "Version unchanged (${{ steps.version_check.outputs.version }}), skipping publish."
          exit 0

      - uses: actions/setup-node@v4
        if: steps.version_check.outputs.changed == 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - run: npm install -g npm@latest
        if: steps.version_check.outputs.changed == 'true'

      - run: npm ci
        if: steps.version_check.outputs.changed == 'true'

      - run: npm run build
        if: steps.version_check.outputs.changed == 'true'

      - run: npm test
        if: steps.version_check.outputs.changed == 'true'

      - name: Publish to npm
        if: steps.version_check.outputs.changed == 'true'
        run: |
          sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          npm publish --provenance --access public

      - name: Create git tag
        if: steps.version_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "v${{ steps.version_check.outputs.version }}" -m "Release v${{ steps.version_check.outputs.version }}" || true
          git push origin "v${{ steps.version_check.outputs.version }}" || true
