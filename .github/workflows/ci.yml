name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up ANTLR4
        run: |
          curl -sL https://www.antlr.org/download/antlr-4.13.2-complete.jar -o /tmp/antlr4.jar
          printf '#!/bin/sh\nexec java -jar /tmp/antlr4.jar "$@"\n' | sudo tee /usr/local/bin/antlr4 > /dev/null
          sudo chmod +x /usr/local/bin/antlr4

      - name: Generate parser
        run: npm run generate

      - name: Run tests
        run: npm test
